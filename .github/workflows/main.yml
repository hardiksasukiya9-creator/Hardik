
name: Build Strict Battery Guardian APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install Gradle 9.3.1
        run: |
          curl -fsSL \
            https://services.gradle.org/distributions/gradle-9.3.1-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE" \
            -type f -name settings.gradle.kts \
            -not -path '*/.git/*' -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            mkdir -p "$RUNNER_TEMP/unpacked-project"

            while IFS= read -r -d '' archive; do
              unzip -oq "$archive" -d "$RUNNER_TEMP/unpacked-project"
            done < <(
              find "$GITHUB_WORKSPACE" -type f -name '*.zip' \
                -not -path '*/.git/*' -print0
            )

            PROJECT_DIR="$(find "$RUNNER_TEMP/unpacked-project" \
              -type f -name settings.gradle.kts \
              -print -quit | xargs -r dirname)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Verify project files
        run: |
          set -e
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"

      - name: Generate Debug Keystore
        run: |
          set -e
          if [ ! -f "$PROJECT_DIR/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$PROJECT_DIR/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -f "$PROJECT_DIR/debug.keystore"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: strict-battery-guardian-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
